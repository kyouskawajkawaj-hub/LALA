<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Pares ni Balong – Admin Dashboard</title>
  <style>
    :root {
      --primary: #8B0000;
      --secondary: #FFD700;
      --bg: #1a1a1a;
      --card: #2a2a2a;
      --text: #f5f5f5;
      --accent: #ffb300;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    header { text-align: center; padding: 1.5rem 0; background: var(--primary); border-bottom: 4px solid var(--secondary); }
    header h1 { color: var(--secondary); font-size: 2rem; }
    .logo-img { font-size: 2rem; }
    .refresh-btn {
      background: var(--secondary);
      color: var(--bg);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 1rem 0;
    }
    .table-wrapper {
      background: var(--card);
      border-radius: 12px;
      padding: 1rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }
    th {
      background: var(--primary);
      color: var(--secondary);
      padding: 0.75rem;
      text-align: left;
      white-space: nowrap;
    }
    td {
      padding: 0.75rem;
      border-bottom: 1px solid #444;
    }
    tr:hover { background: #333; }
    .loading, .error, .empty {
      text-align: center;
      padding: 2rem;
      font-size: 1.1rem;
    }
    .error { color: #ff5252; }
    .note {
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 1rem;
    }
    @media (max-width: 600px) {
      th, td { padding: 0.5rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo-img">🍲 <strong>PARES NI BALONG</strong> 🍲</div>
  <p style="color: var(--secondary);">Admin Dashboard</p>
</header>
<div class="container">
  <button class="refresh-btn" id="refreshBtn">🔄 Refresh Orders</button>
  <div id="status" class="loading">Loading orders...</div>
  <div class="table-wrapper" id="tableWrapper"></div>
  <p class="note">▪ Real‑time sync via Google Sheets ▪ Auto‑refresh every 30 seconds</p>
</div>
<script>
const SHEET_API_URL = 'https://api.sheetbest.com/sheets/2e1c1dfc-eeee-449a-a2ec-2e65a998db95';

let autoRefresh = null;

async function fetchOrders() {
  const statusDiv = document.getElementById('status');
  try {
    const response = await fetch(SHEET_API_URL);
    if (!response.ok) throw new Error('Failed to fetch sheet');
    const data = await response.json();
    renderTable(data);
  } catch (err) {
    console.error(err);
    statusDiv.innerHTML = '<div class="error">❌ Could not load orders. Check your internet or sheet settings.</div>';
    document.getElementById('tableWrapper').innerHTML = '';
  }
}

function renderTable(rows) {
  const statusDiv = document.getElementById('status');
  const wrapper = document.getElementById('tableWrapper');
  if (!rows || rows.length === 0) {
    statusDiv.innerHTML = '<div class="empty">📭 No orders yet.</div>';
    wrapper.innerHTML = '';
    return;
  }
  statusDiv.innerHTML = '';
  const headers = Object.keys(rows[0]);
  let html = '<table><thead><tr>';
  headers.forEach(h => html += `<th>${h}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    headers.forEach(key => {
      const val = row[key] !== undefined ? row[key] : '';
      html += `<td>${val}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrapper.innerHTML = html;
}

document.getElementById('refreshBtn').addEventListener('click', fetchOrders);

autoRefresh = setInterval(fetchOrders, 30000);
fetchOrders();

window.addEventListener('beforeunload', () => clearInterval(autoRefresh));
</script>
</body>
</html>
